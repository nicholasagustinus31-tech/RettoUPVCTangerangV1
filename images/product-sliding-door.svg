<svg width="480" height="360" viewBox="0 0 480 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title">
  <title id="title">Profile Sliding Door</title>
  <defs>
    <linearGradient id="sliding" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#ffeaea" />
      <stop offset="100%" stop-color="#ff2f2f" />
    </linearGradient>
  </defs>
  <rect width="480" height="360" rx="32" fill="url(#sliding)" />
  <g fill="#fff">
    <rect x="120" y="70" width="90" height="220" rx="10" opacity="0.85" />
    <rect x="210" y="70" width="90" height="220" rx="10" opacity="0.85" />
    <rect x="300" y="70" width="60" height="220" rx="10" opacity="0.7" />
  </g>
  <text x="50%" y="330" text-anchor="middle" font-family="Poppins, sans-serif" font-size="24" fill="#ffffff" opacity="0.9">Sliding Door</text>
</svg>
