<svg width="480" height="360" viewBox="0 0 480 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title">
  <title id="title">${name^} placeholder</title>
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ff0000" stop-opacity="0.9" />
    </linearGradient>
  </defs>
  <rect width="480" height="360" rx="32" fill="#1f1f1f" />
  <rect x="20" y="20" width="440" height="320" rx="24" fill="url(#grad)" />
  <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" font-family="Poppins, sans-serif" font-size="32" fill="#ffffff" opacity="0.85">${name^}</text>
</svg>
